<h3>⚽ Match à pronostiquer</h3>

<h2>🇧🇪 Belgique 🆚 Adversaire</h2>

<p>📅 Date : À venir</p>
<p>🕘 Heure : À venir</p>

</div>

<div class="formulaire">

<form>

<br>
<input type="text" placeholder="Exemple : France">

<input type="number" min="0">
<br><br>

<br><br>

<label>Ton prénom ou pseudo :</label>
<br>
<input type="text" placeholder="Exemple : DiableRouge1990">
<br><br>

<button type="submit">Envoyer mon pronostic</button>

</form>
